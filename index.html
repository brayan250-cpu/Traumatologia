<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Fondo oscuro inmediato antes de que cargue CSS/React */
      html, body { background: #030814; margin: 0; }
    </style>

    <!-- Primary SEO -->
    <title>Minda Code - Centro de Traumatología y Ortopedia | Lima, Perú</title>
    <meta name="description" content="Centro especializado en traumatología y ortopedia en Lima. Dr. Carlos Minda Rojas, 18 años de experiencia en artroscopia, reemplazo articular y trauma deportivo. Reserva tu cita online." />
    <meta name="keywords" content="traumatología Lima, ortopedia Lima, artroscopia rodilla, reemplazo articular, trauma deportivo, Dr. Minda Rojas, cirugía articular" />
    <meta name="author" content="Dr. Carlos Minda Rojas" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Minda Code - Centro de Traumatología y Ortopedia" />
    <meta property="og:description" content="Especialistas en regeneración articular, cirugía mínimamente invasiva y recuperación funcional. Dr. Carlos Minda Rojas, 18 años de experiencia." />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="Minda Code" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minda Code - Centro de Traumatología y Ortopedia" />
    <meta name="twitter:description" content="Especialistas en regeneración articular, cirugía mínimamente invasiva y recuperación funcional en Lima, Perú." />

    <!-- Fonts: Public Sans (UI) + IBM Plex Mono (codes/ticket) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Preload crítico -->
    <link rel="preload" href="/models/knee.glb" as="fetch" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalClinic",
      "name": "Minda Code - Centro de Traumatología y Ortopedia",
      "description": "Centro especializado en traumatología, artroscopia, reemplazo articular y trauma deportivo en Lima, Perú.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Av. Javier Prado Este 1234",
        "addressLocality": "San Isidro",
        "addressRegion": "Lima",
        "addressCountry": "PE"
      },
      "telephone": "+51-1-987-654-321",
      "email": "citas@mindacode.pe",
      "openingHours": ["Mo-Fr 08:00-18:00", "Sa 09:00-14:00"],
      "medicalSpecialty": "Traumatología y Ortopedia"
    }
    </script>
  </head>
  <body>
    <!-- Intro overlay: cubre el arranque hasta que React monta -->
    <div id="intro-overlay" style="position:fixed;inset:0;z-index:9999;background:#030814;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
        <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00e6b4,#6c63ff);"></div>
        <span style="font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.35);">Cargando</span>
      </div>
    </div>
    <script>
      // Eliminar overlay suavemente una vez que la pagina este lista
      window.addEventListener('load', function() {
        var el = document.getElementById('intro-overlay');
        if (!el) return;
        setTimeout(function() {
          el.style.opacity = '0';
          setTimeout(function() { el.style.display = 'none'; }, 520);
        }, 200);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
